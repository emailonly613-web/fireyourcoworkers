# DigitalOcean App Platform spec — static site, zero build.
# Replace <OWNER>/<REPO> after pushing to GitHub.
name: fireyourcoworkers
static_sites:
  - name: game
    source_dir: web
    github:
      repo: <OWNER>/<REPO>
      branch: main
      deploy_on_push: true
    index_document: index.html
    error_document: index.html
domains:
  - domain: fireyourcoworkers.com
    type: PRIMARY
  - domain: www.fireyourcoworkers.com
    type: ALIAS
