# DigitalOcean App Platform production spec. The Next.js app is prebuilt into the
# committed public-preview directory, keeping the production component static and free.
name: fireyourcoworkers
region: nyc
static_sites:
  - name: web
    source_dir: public-preview
    git:
      repo_clone_url: https://github.com/emailonly613-web/fireyourcoworkers.git
      branch: main
    index_document: index.html
    error_document: 404.html
domains:
  - domain: fireyourcoworkers.com
    type: PRIMARY
    zone: fireyourcoworkers.com
  - domain: www.fireyourcoworkers.com
    type: ALIAS
    zone: fireyourcoworkers.com
