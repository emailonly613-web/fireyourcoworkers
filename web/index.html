<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fire Your Coworkers</title>
<meta name="description" content="Pack your coworkers into the elevator. They will not enjoy it.">
<meta name="theme-color" content="#0b0f14">
<meta property="og:title" content="Fire Your Coworkers">
<meta property="og:description" content="The satirical elevator-packing puzzle. Squish responsibly.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0b0f14; --shaft:#131b26; --line:rgba(255,255,255,.09);
    --glass:rgba(140,200,255,.07); --ok:#3ddc84; --bad:#ff4d5e;
    --ink:#e9f0f7; --dim:#8ea3b8; --metal1:#232f3d; --metal2:#17202b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:500 16px/1.35 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
    overscroll-behavior:none;touch-action:none;user-select:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{position:relative;width:100%;height:100%;max-width:min(100vw,56.25vh);
    aspect-ratio:9/16;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #16202e 0%, var(--bg) 55%),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.012) 46px 48px)}

  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;gap:8px}
  .brand{font-weight:800;letter-spacing:.02em;font-size:15px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .brand span{color:var(--bad)}
  .stats{display:flex;gap:11px;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stats b{color:var(--ink);font-weight:700}

  #stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:4px 14px}
  #shaft{position:relative;background:linear-gradient(180deg,#15202c,#101823);border-radius:14px;
    box-shadow:inset 0 0 0 2px var(--line), inset 0 22px 44px rgba(0,0,0,.55), 0 18px 40px rgba(0,0,0,.45)}
  #shaft::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
    background:linear-gradient(105deg,transparent 34%,var(--glass) 44%,transparent 55%);
    background-size:220% 100%;animation:sheen 9s ease-in-out infinite}
  @keyframes sheen{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  #shaft.shake{animation:shake .26s linear}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,1px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,2px)}80%{transform:translate(3px,-1px)}}
  .cell{position:absolute;border-radius:6px;background:rgba(255,255,255,.028);
    box-shadow:inset 0 0 0 1px var(--line), inset 0 -8px 14px rgba(0,0,0,.12)}
  .ghost{position:absolute;border-radius:6px;pointer-events:none;opacity:.85;transition:background .08s}
  .ghost.ok{background:rgba(61,220,132,.30);box-shadow:inset 0 0 0 2px var(--ok),0 0 18px rgba(61,220,132,.25)}
  .ghost.bad{background:rgba(255,77,94,.28);box-shadow:inset 0 0 0 2px var(--bad),0 0 18px rgba(255,77,94,.25)}

  /* Elevator doors — cosmetic; slide shut on a completed floor. */
  #doors{position:absolute;overflow:hidden;border-radius:14px;pointer-events:none;z-index:70}
  .door{position:absolute;top:0;height:100%;width:51%;
    background:linear-gradient(90deg,var(--metal1),var(--metal2));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    transition:transform .58s cubic-bezier(.55,0,.2,1)}
  .door::after{content:"";position:absolute;top:8%;bottom:8%;width:3px;background:rgba(0,0,0,.5)}
  .dl{left:0;transform:translateX(-103%)}.dl::after{right:0}
  .dr{right:0;transform:translateX(103%)}.dr::after{left:0}
  #doors.closed .dl,#doors.closed .dr{transform:translateX(0)}

  /* flex:none — a rack piece must never be shrunk by the flex container. */
  .piece{position:absolute;left:0;top:0;flex:none;will-change:transform;touch-action:none;cursor:grab}
  .piece.held{cursor:grabbing;z-index:50;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
  .body{position:relative;width:100%;height:100%;transform-origin:center center;
    transition:transform .18s cubic-bezier(.2,.9,.25,1.2)}
  /* .skin carries CSS animations so they never fight the inline squish transform on .body */
  .skin{position:absolute;inset:0;animation:idle 3.4s ease-in-out infinite}
  .piece.held .skin{animation:none}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5%)}}
  .landed .skin{animation:settle .4s cubic-bezier(.2,.9,.3,1.4), idle 3.4s .4s ease-in-out infinite}
  @keyframes settle{0%{transform:translateY(-7%) scale(1.05,.9)}55%{transform:translateY(1%) scale(.97,1.05)}100%{transform:translateY(0) scale(1,1)}}
  .blk{position:absolute;border-radius:8px}
  .face{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;transition:transform .18s ease}
  .eyes{display:flex;gap:22%;width:60%;justify-content:center}
  .eye{width:15%;aspect-ratio:1;background:#10161d;border-radius:50%;transition:all .15s;
    animation:blink 4.6s var(--bd,0s) infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%,98%{transform:scaleY(.12)}}
  .mouth{margin-top:12%;width:34%;height:9%;background:#10161d;border-radius:0 0 40% 40%;transition:all .15s}
  .zzz{position:absolute;top:-18%;right:-8%;font-size:15px;color:#bcd;opacity:.9;
    animation:zfloat 2.6s ease-in-out infinite;transition:transform .2s,opacity .2s}
  @keyframes zfloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26%) rotate(8deg)}}

  /* Per-character looks */
  .k-intern .eye{height:14%;border-radius:2px;animation:none;transform:scaleY(.28)}
  .k-printer .eye,.k-coffee .eye{width:18%;height:9%;border-radius:2px;animation:none}
  .k-printer .mouth,.k-coffee .mouth{display:none}
  .k-printer .face,.k-coffee .face{opacity:.8}
  .k-dog .mouth{background:#ff90a8;width:22%;height:15%;border-radius:0 0 50% 50%}
  .k-sales .mouth{width:44%;height:11%}
  .k-hr .mouth{width:38%;height:5%;border-radius:2px}
  .k-plant .eye{width:12%}
  .k-plant .mouth{width:22%;height:6%}

  .acc{position:absolute;pointer-events:none}
  .acc-tie{left:44%;top:76%;width:13%;height:28%;background:#c0392b;
    clip-path:polygon(50% 0,100% 28%,55% 100%,45% 100%,0 28%)}
  .acc-tieB{left:44%;top:76%;width:13%;height:28%;background:#2e5fd0;
    clip-path:polygon(50% 0,100% 28%,55% 100%,45% 100%,0 28%)}
  .acc-glasses{left:16%;top:25%;width:68%;height:20%;border:2.5px solid #10161d;border-radius:5px;
    background:rgba(180,220,255,.16)}
  .acc-monocle{right:20%;top:24%;width:22%;aspect-ratio:1;border:2.5px solid #10161d;border-radius:50%;
    background:rgba(180,220,255,.18)}
  .acc-crown{top:-15%;left:24%;width:52%;height:20%;background:linear-gradient(#ffe27a,#e8b53a);
    clip-path:polygon(0 100%,0 25%,20% 60%,40% 8%,60% 60%,80% 8%,100% 25%,100% 100%)}
  .acc-band{top:5%;left:12%;width:76%;height:13%;background:#ff5d5d;border-radius:4px}
  .acc-headset{left:14%;top:0;width:72%;height:42%;border:3px solid #10161d;border-bottom:none;
    border-radius:50% 50% 0 0}
  .acc-mic{left:6%;top:52%;width:10%;height:8%;background:#10161d;border-radius:3px}
  .acc-phone{right:-5%;top:36%;width:20%;height:36%;background:#22303e;border:2px solid #10161d;border-radius:3px}
  .acc-blushL,.acc-blushR{top:48%;width:12%;height:8%;background:rgba(255,90,120,.55);border-radius:50%}
  .acc-blushL{left:12%}.acc-blushR{right:12%}
  .acc-clipboard{left:-7%;top:38%;width:22%;height:38%;background:#d9c8a9;border:2px solid #10161d;border-radius:2px}
  .acc-leafL,.acc-leafR{top:-14%;width:26%;height:26%;background:#3f9e4f;border-radius:0 60% 0 60%}
  .acc-leafL{left:16%;transform:rotate(-18deg)}
  .acc-leafR{right:16%;transform:rotate(24deg) scaleX(-1)}
  .acc-slot{left:15%;top:58%;width:70%;height:8%;background:#1a232e;border-radius:2px}
  .acc-led{right:8%;top:8%;width:10%;aspect-ratio:1;border-radius:50%;background:#2aff6a;
    animation:ledBlink 1.6s infinite}
  @keyframes ledBlink{0%,60%,100%{opacity:1}70%,90%{opacity:.25}}
  .acc-steam1,.acc-steam2,.acc-steam3{top:-20%;width:6%;height:20%;background:rgba(255,255,255,.5);
    border-radius:40%;animation:steamUp 2.2s ease-in-out infinite}
  .acc-steam1{left:30%}.acc-steam2{left:47%;animation-delay:.5s}.acc-steam3{left:64%;animation-delay:1s}
  @keyframes steamUp{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-90%);opacity:0}}
  .acc-earL,.acc-earR{top:-13%;width:24%;height:30%;background:#b9834b;border-radius:60% 60% 0 0}
  .acc-earL{left:8%;transform:rotate(-10deg)}.acc-earR{right:8%;transform:rotate(10deg)}
  .acc-drool{left:58%;top:62%;width:7%;height:18%;background:#bfe6ff;border-radius:0 0 50% 50%}

  /* Tray */
  #tray{min-height:24%;padding:10px 12px 64px;display:flex;align-items:center;
    justify-content:center;gap:12px;flex-wrap:wrap;position:relative}
  #tray::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line)}
  .pop{animation:popIn .38s cubic-bezier(.2,.9,.3,1.35) both}
  @keyframes popIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

  /* FX */
  .confetti{position:absolute;width:9px;height:13px;border-radius:2px;pointer-events:none;z-index:85;
    animation:confettiFall linear both}
  @keyframes confettiFall{0%{transform:translateY(-4%) rotate(0)}100%{transform:translateY(108vh) rotate(560deg);opacity:.15}}
  .poof{position:absolute;width:9px;height:9px;border-radius:50%;background:#cfe0f0;pointer-events:none;z-index:65;
    animation:poofOut .5s ease-out both}
  @keyframes poofOut{0%{transform:translate(0,0) scale(1);opacity:.9}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .scorepop{position:absolute;font-weight:800;font-size:17px;color:#ffe27a;text-shadow:0 2px 8px rgba(0,0,0,.6);
    pointer-events:none;z-index:66;animation:riseFade .8s ease-out both}
  @keyframes riseFade{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}

  #bubble{position:absolute;left:50%;transform:translate(-50%,8px);top:8px;max-width:84%;
    background:#f6fbff;color:#101820;padding:9px 13px;border-radius:13px;font-size:13.5px;
    font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
    box-shadow:0 10px 26px rgba(0,0,0,.45);z-index:80}
  #bubble b{color:#c2233}
  #bubble.show{opacity:1;transform:translate(-50%,0)}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;
    border:7px solid transparent;border-top-color:#f6fbff;border-bottom:0}

  #hud{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:0 14px 12px;z-index:60}
  button{flex:1;padding:12px 8px;border:0;border-radius:12px;
    background:linear-gradient(180deg,#223349,#1a2735);color:var(--ink);
    font:700 14px/1 inherit;letter-spacing:.01em;box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);
    transition:transform .06s}
  button:active{transform:translateY(2px) scale(.99)}
  button.primary{background:linear-gradient(180deg,#ff6572,#e8404f);color:#fff}
  button.gold{background:linear-gradient(180deg,#f2c94c,#d9a520);color:#231a05}
  button:disabled{opacity:.4}

  /* Company Store */
  #shop{position:absolute;inset:0;background:rgba(6,10,14,.9);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:88}
  #shop.show{display:flex}
  #shopCard{width:100%;max-width:340px;background:linear-gradient(180deg,#18222e,#111925);
    border-radius:18px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    display:flex;flex-direction:column;gap:10px}
  #shopHead{display:flex;align-items:center;justify-content:space-between}
  #shopTitle{font-weight:850;letter-spacing:.06em;font-size:15px}
  #shopCoins{font-weight:700;font-size:14px;color:#f2c94c}
  #shopItems{display:flex;flex-direction:column;gap:8px}
  .shopItem{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);
    border-radius:12px;padding:10px;box-shadow:inset 0 0 0 1px var(--line)}
  .shopSw{display:flex;gap:3px;flex:none}
  .shopSw i{width:13px;height:13px;border-radius:4px;display:block}
  .shopInfo{flex:1;min-width:0}
  .shopName{font-weight:750;font-size:13.5px}
  .shopDesc{font-size:11.5px;color:var(--dim)}
  .shopBtn{flex:none;min-width:86px;padding:9px 10px;font-size:12.5px;border-radius:10px}
  .shopBtn.owned{background:#1d3a2a;color:var(--ok)}
  .premTag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;
    color:#231a05;background:linear-gradient(180deg,#f2c94c,#d9a520);border-radius:4px;
    padding:1.5px 5px;vertical-align:1px;margin-left:5px}
  #shopNote{font-size:11px;color:var(--dim);text-align:center}
  #shopClose{width:100%}

  #overlay{position:absolute;inset:0;background:rgba(6,10,14,.93);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;z-index:90}
  #overlay.show{display:flex}
  #ovTitle{font-size:28px;font-weight:850;letter-spacing:-.01em}
  #ovBody{color:var(--dim);font-size:15px;max-width:28ch}
  #ovScore{font-size:15px;color:var(--ink)}
  #ovRating{font-size:13.5px;font-weight:750;color:#f2c94c;background:rgba(242,201,76,.1);
    border:1px solid rgba(242,201,76,.35);border-radius:9px;padding:7px 12px}
  #ovRating:empty{display:none}
  #overlay button{flex:none;min-width:210px}

  @media (prefers-reduced-motion:reduce){
    .skin,.eye,.zzz,#shaft::after,.acc-led,.acc-steam1,.acc-steam2,.acc-steam3{animation:none!important}
  }
</style>
</head>
<body>
<div id="app"><div id="game">
  <header>
    <div class="brand">FIRE YOUR <span>COWORKERS</span></div>
    <div class="stats">
      <div>FLOOR <b id="lvl">1</b><span id="lvlTotal"></span></div>
      <div><b id="score">0</b> pts</div>
      <div>🪙 <b id="coins">0</b></div>
    </div>
  </header>

  <div id="stage">
    <div id="shaft"></div>
    <div id="doors"><div class="door dl"></div><div class="door dr"></div></div>
  </div>
  <div id="bubble"></div>
  <div id="tray"></div>

  <div id="hud">
    <button id="btnRotate">Rotate</button>
    <button id="btnUndo">Undo</button>
    <button id="btnReset">Restart</button>
    <button id="btnShop" class="gold">Shop</button>
  </div>

  <div id="shop">
    <div id="shopCard">
      <div id="shopHead">
        <div id="shopTitle">COMPANY STORE</div>
        <div id="shopCoins">🪙 <b>0</b></div>
      </div>
      <div id="shopItems"></div>
      <div id="shopNote">Earn coins by clearing floors. Real-money instant unlocks arrive at launch.</div>
      <button id="shopClose">Back to work</button>
    </div>
  </div>

  <div id="overlay">
    <div id="ovTitle"></div>
    <div id="ovBody"></div>
    <div id="ovRating"></div>
    <div id="ovScore"></div>
    <button id="ovShare">Challenge a coworker 🔗</button>
    <button id="ovBtn" class="primary"></button>
  </div>
</div></div>

<script>
"use strict";

/* ---------------- Content database (PRD schema: shape_matrix = [x,y] pairs, y up) ------------- */
const CHARACTERS = [
  { id:"sleeping_intern", name:"The Sleeping Intern", kind:"intern", sleepy:true,
    shape_matrix:[[0,0],[0,1],[0,2]], dimensions:"1x3 Vertical Block",
    base_score:100, color:"#7fd1ff", squish:0.24,
    audio_triggers:{
      on_grab:"I'm awake, I'm awake!",
      on_success:"…zzz… wake me when we get there…",
      on_fail:"Is my internship over?" } },

  { id:"micromanager_boss", name:"The Micromanager", kind:"boss",
    shape_matrix:[[0,0],[1,0],[2,0],[1,1]], dimensions:"4-Block T-Shape",
    base_score:250, color:"#ffb457", squish:0.13,
    audio_triggers:{
      on_grab:"Let's synergize our personal space here!",
      on_success:"Excellent. I will circle back with you shortly.",
      on_fail:"This is not a culturally aligned fit!" } },

  { id:"broken_printer", name:"The Office Copier", kind:"printer", machine:true,
    shape_matrix:[[0,0],[0,1],[1,0],[1,1]], dimensions:"2x2 Square Block",
    base_score:150, color:"#b9c4d0", squish:0.05,
    audio_triggers:{
      on_grab:"*mechanical grinding, sparks*",
      on_success:"Paper jam resolved!",
      on_fail:"ERROR 0x4F — PC LOAD LETTER" } },

  { id:"gossip_worker", name:"The Breakroom Gossip", kind:"gossip",
    shape_matrix:[[0,0],[1,0],[1,1],[2,1]], dimensions:"4-Block Z-Shape",
    base_score:200, color:"#ff8fb1", squish:0.22,
    audio_triggers:{
      on_grab:"Oh my gosh, did you hear about Brenda?",
      on_success:"Keep it on the down-low, but…",
      on_fail:"Ouch! Don't push me into HR!" } },

  { id:"hr_manager", name:"The HR Manager", kind:"hr",
    shape_matrix:[[0,0],[0,1],[0,2],[1,0]], dimensions:"4-Block L-Shape",
    base_score:275, color:"#c9a0ff", squish:0.13,
    audio_triggers:{
      on_grab:"This conversation is being documented.",
      on_success:"Per my last email.",
      on_fail:"Let's take this offline. Forever." } },

  { id:"it_guy", name:"The IT Guy", kind:"it",
    shape_matrix:[[0,0],[1,0],[2,0],[3,0]], dimensions:"1x4 Line Block",
    base_score:225, color:"#35d0ba", squish:0.2,
    audio_triggers:{
      on_grab:"Have you tried turning it off and on?",
      on_success:"Ticket closed. Ticket closed. Ticket closed.",
      on_fail:"That's a hardware problem." } },

  { id:"office_plant", name:"The Office Plant", kind:"plant",
    shape_matrix:[[0,0]], dimensions:"1x1 Block",
    base_score:50, color:"#6ecb63", squish:0.07,
    audio_triggers:{
      on_grab:"…",
      on_success:"(photosynthesizing contentedly)",
      on_fail:"(a single leaf falls)" } },

  { id:"coffee_machine", name:"The Coffee Machine", kind:"coffee", machine:true,
    shape_matrix:[[0,0],[0,1]], dimensions:"1x2 Vertical Block",
    base_score:100, color:"#b07a4f", squish:0.05,
    audio_triggers:{
      on_grab:"(gurgling intensifies)",
      on_success:"Fresh pot. Best pot.",
      on_fail:"(steam hisses in despair)" } },

  { id:"overachiever", name:"The Overachiever", kind:"achiever",
    shape_matrix:[[1,0],[2,0],[0,1],[1,1]], dimensions:"4-Block S-Shape",
    base_score:225, color:"#c1f26b", squish:0.22,
    audio_triggers:{
      on_grab:"I already did next week's work!",
      on_success:"Circle back? I've already circled!",
      on_fail:"This will NOT look good on my self-review." } },

  { id:"the_ceo", name:"The CEO", kind:"ceo",
    shape_matrix:[[1,0],[0,1],[1,1],[2,1],[1,2]], dimensions:"5-Block Plus",
    base_score:400, color:"#ffd166", squish:0.1,
    audio_triggers:{
      on_grab:"Do you know who I am?",
      on_success:"I built this elevator. Metaphorically.",
      on_fail:"My lawyer will hear about this." } },

  { id:"sales_guy", name:"The Sales Guy", kind:"sales",
    shape_matrix:[[0,0],[1,0],[1,1],[1,2]], dimensions:"4-Block J-Shape",
    base_score:175, color:"#5d8bf4", squish:0.2,
    audio_triggers:{
      on_grab:"Always. Be. Compressing!",
      on_success:"Ka-ching! Deal closed.",
      on_fail:"I can't close in these conditions!" } },

  { id:"office_dog", name:"The Office Dog", kind:"dog",
    shape_matrix:[[0,0],[1,0]], dimensions:"2x1 Horizontal Block",
    base_score:75, color:"#e3a869", squish:0.26,
    audio_triggers:{
      on_grab:"BORK!",
      on_success:"(happy tail thumping)",
      on_fail:"(the saddest whimper)" } }
];

/*__LEVELS_START__*/
const LEVELS = [
  {"w":3,"h":4,"name":"Orientation Day","cast":["sleeping_intern","broken_printer"],"premium":false,"solution":[{"r":0,"x":2,"y":0},{"r":0,"x":0,"y":0}]},

/* ---------------- Shape maths (pure, deterministic) ------------------------------------------ */
function normalize(cells){
  let mx=Infinity,my=Infinity;
  for(const c of cells){ if(c[0]<mx)mx=c[0]; if(c[1]<my)my=c[1]; }
  return cells.map(c=>[c[0]-mx,c[1]-my]);
}
function rotateCW(cells){ return normalize(cells.map(([x,y])=>[y,-x])); }
function rotateN(cells,n){ let s=normalize(cells); for(let i=0;i<(n%4+4)%4;i++) s=rotateCW(s); return s; }
function extent(cells){
  let w=0,h=0; for(const [x,y] of cells){ if(x+1>w)w=x+1; if(y+1>h)h=y+1; } return [w,h];
}
function sameShape(a,b){
  if(a.length!==b.length) return false;
  const k=s=>s.map(c=>c.join(",")).sort().join("|");
  return k(a)===k(b);
}

/* ---------------- Colour helpers ------------------------------------------------------------- */
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const f=c=>Math.max(0,Math.min(255,Math.round(c+amt)));
  return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`;
}

/* ---------------- Audio: synthesized, zero assets -------------------------------------------- */
let AC=null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended") AC.resume(); return AC; }
function tone(freq,dur,type,gain,slideTo){
  try{
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo),c.currentTime+dur);
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(gain==null?0.13:gain,c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008,c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+0.02);
  }catch(e){}
}
function noise(dur,gain,freq){
  try{
    const c=ac(), n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
    f.type="bandpass"; f.frequency.value=freq||1100;
    g.gain.value=gain==null?0.10:gain;
    s.buffer=b; s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }catch(e){}
}

/** Rack pieces share the space, so any change to how many are left resizes them all. */
function relayoutTray(){
  pieces.filter(p=>!p.placed).forEach(p=>{ buildPieceEl(p); positionInTray(p); });
}

/**
 * Size for a piece sitting in the rack. Derived from the rack's real measured box and
 * how many pieces share it — never from a multiple of the grid cell, which on a short
 * grid produces cells so large a 3-tall piece overflows off-screen.
 */
function trayUnitFor(cells){
  const [w,h]=extent(cells);
  const box=tray.getBoundingClientRect();
  const n=Math.max(1, pieces.filter(q=>!q.placed).length);
  const rows=n>4?2:1, perRow=Math.ceil(n/rows);
  const availH=Math.max(26, ((box.height||160)-76)/rows - (rows>1?8:0));
  const availW=Math.max(26, ((box.width||300)-24)/perRow - 12);
  return Math.max(12, Math.floor(Math.min(availW/w, availH/h, cellPx)));
}

/* ---------------- Piece construction --------------------------------------------------------- */
function buildPieceEl(p){
  const def=p.def, cells=p.shape, [w,h]=extent(cells);
  // A piece being dragged or already placed MUST render at exactly one grid cell per
  // block: the drop position is measured in grid units, so any other scale makes the
  // piece land somewhere its own ghost is not.
  const full = p.placed || p.dragging;
  const unit = full ? cellPx : trayUnitFor(cells);
  if(!p.el){
    p.el=document.createElement("div"); p.el.className="piece";
    p.body=document.createElement("div"); p.body.className="body";
    p.skin=document.createElement("div"); p.skin.className="skin";
    p.body.appendChild(p.skin);
    p.el.appendChild(p.body);
    p.el.addEventListener("pointerdown",onDown);
  }
  p.unit=unit;
  p.el.style.width=(w*unit)+"px"; p.el.style.height=(h*unit)+"px";
  p.skin.innerHTML="";
  const col=skinColor(def);
  const light=shade(col,34), dark=shade(col,-38);
  for(const [x,y] of cells){
    const b=document.createElement("div"); b.className="blk";
    b.style.cssText=`left:${x*unit+2}px;top:${(h-1-y)*unit+2}px;width:${unit-4}px;height:${unit-4}px;
      background:linear-gradient(160deg,${light} 0%,${col} 45%,${dark} 100%);
      box-shadow:inset 0 -${Math.max(2,unit*.09)}px 0 rgba(0,0,0,.18),inset 0 1.5px 0 rgba(255,255,255,.28),0 2px 6px rgba(0,0,0,.3)`;
    p.skin.appendChild(b);
  }
  // The face lives on the shape's TOPMOST, leftmost cell — the head.
  let fx=cells[0][0], fy=cells[0][1];
  for(const [x,y] of cells){ if(y>fy||(y===fy&&x<fx)){fx=x;fy=y;} }
  const f=document.createElement("div"); f.className="face k-"+def.kind;
  f.style.cssText=`left:${fx*unit}px;top:${(h-1-fy)*unit}px;width:${unit}px;height:${unit}px;--bd:${(p.uid*0.7%3).toFixed(2)}s`;
  f.innerHTML=`<div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div>`
            + (def.sleepy?`<div class="zzz">z</div>`:``);
  for(const cls of (ACCESSORIES[def.kind]||[])){
    const a=document.createElement("div"); a.className="acc "+cls; f.appendChild(a);
  }
  p.skin.appendChild(f); p.face=f;
  return p.el;
}

function positionInTray(p){
  // left/top were absolute coordinates while dragging; as a relative element they
  // become offsets, so they must be cleared or the piece lands off-screen.
  p.el.style.position="relative";
  p.el.style.left=""; p.el.style.top="";
  p.el.style.transform="none";
  p.el.classList.remove("landed");
  if(p.el.parentNode!==tray) tray.appendChild(p.el);
}
function positionOnGrid(p){
  const d=levelDef(), [ ,h]=extent(p.shape);
  const r=shaft.getBoundingClientRect(), g=gameEl.getBoundingClientRect();
  p.el.style.position="absolute";
  p.el.style.left=(r.left-g.left+p.anchor[0]*cellPx)+"px";
  p.el.style.top =(r.top -g.top +(d.h-p.anchor[1]-h)*cellPx)+"px";
  p.el.style.transform="none";
  if(p.el.parentNode!==gameEl) gameEl.appendChild(p.el);
}

/* ---------------- Grid logic ----------------------------------------------------------------- */
function inBounds(x,y){ const d=levelDef(); return x>=0&&y>=0&&x<d.w&&y<d.h; }
function canPlace(p,ax,ay){
  for(const [x,y] of p.shape){
    const gx=ax+x, gy=ay+y;
    if(!inBounds(gx,gy)) return false;
    if(grid[gy][gx]!==null && grid[gy][gx]!==p.uid) return false;
  }
  return true;
}
function commit(p,ax,ay){
  for(const [x,y] of p.shape) grid[ay+y][ax+x]=p.uid;
  p.placed=true; p.anchor=[ax,ay];
}
function release(p){
  for(let y=0;y<grid.length;y++) for(let x=0;x<grid[y].length;x++) if(grid[y][x]===p.uid) grid[y][x]=null;
  p.placed=false; p.anchor=null;
}
function hasAnyFit(p){
  const d=levelDef();
  for(let r=0;r<4;r++){
    const s=rotateN(p.baseShape,r), [w,h]=extent(s), keep=p.shape; p.shape=s;
    for(let ay=0;ay<=d.h-h;ay++) for(let ax=0;ax<=d.w-w;ax++) if(canPlace(p,ax,ay)){ p.shape=keep; return true; }
    p.shape=keep;
  }
  return false;
}

/* ---------------- Squish-Fit: cosmetic only, never touches `grid` ---------------------------- */
function pressureOf(p){
  let Lp=0,R=0,D=0,U=0;
  for(const [x,y] of p.shape){
    const gx=p.anchor[0]+x, gy=p.anchor[1]+y;
    const probe=(nx,ny)=>{
      if(!inBounds(nx,ny)) return 2;                 // elevator wall
      const o=grid[ny][nx];
      return (o!==null && o!==p.uid) ? 1 : 0;        // neighbouring coworker
    };
    Lp=Math.max(Lp,probe(gx-1,gy)); R=Math.max(R,probe(gx+1,gy));
    D=Math.max(D,probe(gx,gy-1)); U=Math.max(U,probe(gx,gy+1));
  }
  return {L:Lp,R,D,U,sides:[Lp,R,D,U].filter(v=>v>0).length};
}
function applySquish(p){
  const def=p.def, pr=pressureOf(p);
  const MAX = def.squish!=null ? def.squish : 0.2;
  const amt = v => v===0?0 : (v===2?0.13:0.09);
  const hx=Math.min(MAX, amt(pr.L)+amt(pr.R)), vy=Math.min(MAX, amt(pr.D)+amt(pr.U));
  const sx=1-hx+vy*0.45, sy=1-vy+hx*0.45;
  const tx=(amt(pr.L)-amt(pr.R))*0.5*p.unit, ty=(amt(pr.D)-amt(pr.U))*0.5*p.unit;
  p.body.style.transform=`translate(${tx.toFixed(2)}px,${(-ty).toFixed(2)}px) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;

  // Face reacts to the same pressure. Equipment has no feelings.
  if(!def.machine){
    const eyes=p.face.querySelectorAll(".eye"), mouth=p.face.querySelector(".mouth");
    const squeezed = pr.sides>=3, pinched = pr.L>0&&pr.R>0;
    eyes.forEach(e=>{
      e.style.height = squeezed? "6%" : (pinched? "9%" : "");
      e.style.borderRadius = squeezed? "40%" : "50%";
    });
    if(mouth){
      mouth.style.width = squeezed? "20%" : (pinched? "26%" : "");
      const authority = def.kind==="boss"||def.kind==="ceo"||def.kind==="hr";
      mouth.style.borderRadius = (squeezed||authority&&pinched) ? "40% 40% 0 0" : "";
    }
    const z=p.face.querySelector(".zzz");
    if(z){ const strong=pr.sides>=3; z.style.opacity=strong?"0":"0.9"; z.style.transform=strong?"scale(.4)":"none"; }
  }
}
function clearSquish(p){
  p.body.style.transform="none";
  p.face.querySelectorAll(".eye").forEach(e=>{e.style.height="";e.style.borderRadius="";});
  const m=p.face.querySelector(".mouth"); if(m){m.style.width="";m.style.borderRadius="";}
  const z=p.face.querySelector(".zzz"); if(z){z.style.opacity="";z.style.transform="";}
}
function refreshAllSquish(){ pieces.forEach(p=>{ if(p.placed) applySquish(p); else clearSquish(p); }); }

/* ---------------- FX ------------------------------------------------------------------------- */
function spawnConfetti(){
  const colors=CHARACTERS.map(c=>c.color);
  for(let i=0;i<26;i++){
    const el=document.createElement("div"); el.className="confetti";
    el.style.left=(4+Math.random()*92)+"%";
    el.style.top="-4%";
    el.style.background=colors[i%colors.length];
    el.style.animationDuration=(1.1+Math.random()*0.9)+"s";
    el.style.animationDelay=(Math.random()*0.35)+"s";
    gameEl.appendChild(el);
    setTimeout(()=>el.remove(),2600);
  }
}
function spawnPoof(x,y){
  for(let i=0;i<7;i++){
    const el=document.createElement("div"); el.className="poof";
    const ang=Math.random()*Math.PI*2, d=20+Math.random()*26;
    el.style.left=x+"px"; el.style.top=y+"px";
    el.style.setProperty("--dx",Math.cos(ang)*d+"px");
    el.style.setProperty("--dy",Math.sin(ang)*d+"px");
    gameEl.appendChild(el);
    setTimeout(()=>el.remove(),600);
  }
}
function spawnScorePop(x,y,text){
  const el=document.createElement("div"); el.className="scorepop";
  el.textContent=text; el.style.left=(x-18)+"px"; el.style.top=(y-14)+"px";
  gameEl.appendChild(el);
  setTimeout(()=>el.remove(),900);
}
function shakeShaft(){
  shaft.classList.remove("shake"); void shaft.offsetWidth; shaft.classList.add("shake");
}

/* ---------------- Speech bubble -------------------------------------------------------------- */
let bubbleTimer=null;
function say(speaker,text){
  bubbleEl.innerHTML=`<b>${speaker}</b>&nbsp; ${text}`;
  bubbleEl.classList.add("show");
  clearTimeout(bubbleTimer); bubbleTimer=setTimeout(()=>bubbleEl.classList.remove("show"),2000);
}

/* ---------------- Drag / rotate -------------------------------------------------------------- */
let dragMoved=false, startPt=null;

function onDown(e){
  if(overlay.classList.contains("show")) return;
  if(document.getElementById("shop").classList.contains("show")) return;
  const p=pieces.find(q=>q.el===e.currentTarget); if(!p) return;
  e.preventDefault(); ac();

  if(p.placed){ release(p); refreshAllSquish(); }

  held=p; dragMoved=false; startPt={x:e.clientX,y:e.clientY};
  // Capture is an optimisation, not a requirement: move/up are bound to window.
  try{ p.el.setPointerCapture(e.pointerId); }catch(_){}
  p.el.classList.add("held");
  p.el.classList.remove("pop","landed");

  // Remember which of the piece's own cells was grabbed, so the piece follows the
  // finger honestly instead of snapping its corner to the cursor.
  const r=p.el.getBoundingClientRect(), [,h]=extent(p.shape);
  const cx=Math.floor((e.clientX-r.left)/p.unit), cy=h-1-Math.floor((e.clientY-r.top)/p.unit);
  p.grab=[Math.max(0,Math.min(cx, extent(p.shape)[0]-1)), Math.max(0,Math.min(cy,h-1))];

  p.dragging=true;
  buildPieceEl(p);                       // re-render at full grid scale while dragging
  const g=gameEl.getBoundingClientRect();
  p.el.style.position="absolute";
  gameEl.appendChild(p.el);
  moveTo(e.clientX-g.left, e.clientY-g.top);
  clearSquish(p);
  say(p.def.name, p.def.audio_triggers.on_grab); playSfx(p.def.kind,"grab");

  window.addEventListener("pointermove",onMove);
  window.addEventListener("pointerup",onUp);
  window.addEventListener("pointercancel",onUp);
}

function moveTo(gx,gy){
  const p=held, [w,h]=extent(p.shape);
  p.el.style.left=(gx-(p.grab[0]+0.5)*p.unit)+"px";
  p.el.style.top =(gy-((h-1-p.grab[1])+0.5)*p.unit)+"px";
  updateGhost();
}

function pointerAnchor(){
  const p=held, r=shaft.getBoundingClientRect();
  const d=levelDef(), pr=p.el.getBoundingClientRect(), [,h]=extent(p.shape);
  const lx=pr.left-r.left, ty=pr.top-r.top;
  const ax=Math.round(lx/cellPx), ayTop=Math.round(ty/cellPx);
  return [ax, d.h-ayTop-h];
}

function updateGhost(){
  ghost.forEach(g=>g.remove()); ghost=[];
  if(!held) return;
  const d=levelDef(), [ax,ay]=pointerAnchor();
  let anyIn=false;
  for(const [x,y] of held.shape) if(inBounds(ax+x,ay+y)) anyIn=true;
  if(!anyIn) return;                                   // pointer left the shaft: hide preview
  const ok=canPlace(held,ax,ay);
  for(const [x,y] of held.shape){
    const gx=ax+x, gy=ay+y; if(!inBounds(gx,gy)) continue;
    const el=document.createElement("div");
    el.className="ghost "+(ok?"ok":"bad");
    el.style.cssText+=`left:${gx*cellPx+3}px;top:${(d.h-1-gy)*cellPx+3}px;width:${cellPx-6}px;height:${cellPx-6}px`;
    shaft.appendChild(el); ghost.push(el);
  }
}

function onMove(e){
  if(!held) return;
  if(Math.abs(e.clientX-startPt.x)+Math.abs(e.clientY-startPt.y)>7) dragMoved=true;
  const g=gameEl.getBoundingClientRect();
  moveTo(e.clientX-g.left,e.clientY-g.top);
}

function onUp(e){
  window.removeEventListener("pointermove",onMove);
  window.removeEventListener("pointerup",onUp);
  window.removeEventListener("pointercancel",onUp);
  if(!held) return;
  const p=held;
  p.el.classList.remove("held");

  if(!dragMoved){ rotateHeld(); held=null; ghost.forEach(g=>g.remove()); ghost=[]; sendHome(p); return; }

  const [ax,ay]=pointerAnchor();
  ghost.forEach(g=>g.remove()); ghost=[];
  held=null;

  const g=gameEl.getBoundingClientRect();
  const dropX=e.clientX-g.left, dropY=e.clientY-g.top;

  if(canPlace(p,ax,ay)){
    history.push({uid:p.uid, shape:p.shape.map(c=>c.slice()), rot:p.rot});
    p.dragging=false;
    commit(p,ax,ay); buildPieceEl(p); positionOnGrid(p); relayoutTray();
    p.el.classList.add("landed");
    score+=p.def.base_score; document.getElementById("score").textContent=score;
    spawnScorePop(dropX,dropY,"+"+p.def.base_score);
    say(p.def.name, p.def.audio_triggers.on_success); playSfx(p.def.kind,"success");
    refreshAllSquish(); checkEnd();
  }else{
    floorInvalid++;
    say(p.def.name, p.def.audio_triggers.on_fail); playSfx(p.def.kind,"fail");
    shakeShaft(); spawnPoof(dropX,dropY);
    p.body.style.transform="scale(1.14,0.82)";
    setTimeout(()=>{ p.body.style.transform="none"; },170);
    sendHome(p);
  }
  syncButtons();
}

function sendHome(p){
  p.dragging=false;
  p.shape=rotateN(p.baseShape,p.rot);
  buildPieceEl(p); positionInTray(p); clearSquish(p);
}

function rotateHeld(){
  const p=held||pieces.find(q=>!q.placed);
  if(!p) return;
  p.rot=(p.rot+1)%4; p.shape=rotateN(p.baseShape,p.rot);
  if(held){
    const [w,h]=extent(p.shape);
    p.grab=[Math.min(p.grab[0],w-1), Math.min(p.grab[1],h-1)];
    buildPieceEl(p);
    p.body.style.transform="scale(1.10,0.92)";
    setTimeout(()=>{ if(!p.placed) p.body.style.transform="none"; },150);
    updateGhost();
  }else{
    buildPieceEl(p); positionInTray(p);
  }
  tone(440,.07,"triangle",.05);
}

/* ---------------- Win / lose ----------------------------------------------------------------- */
function updateBest(){
  if(score>best){ best=score; saveBest(best); }
  const el=document.getElementById("best"); if(el) el.textContent=best;
}
function checkEnd(){
  const left=pieces.filter(p=>!p.placed);
  if(left.length===0){
    const bonus=250;
    score+=bonus; document.getElementById("score").textContent=score;
    // Floor payout: enough to feel progress, slow enough that premium stays desirable.
    const payout=25+pieces.length*10+Math.round(bonus/10);
    wallet.coins+=payout; saveWallet(); updateCoinsUI();
    updateBest();
    dingWin();
    doors.classList.add("closed");
    setTimeout(()=>{
      spawnConfetti();
      const nm=levelDef().name?`"${levelDef().name}" cleared. `:"";
      show("Everyone fits.", nm+"The doors close. Nobody makes eye contact.",
        `+${bonus} packing bonus · +${payout} 🪙 · ${score} pts`,
        L+1<LEVELS.length?"Next floor":"Play again", nextLevel, hrRating());
    },680);
    return;
  }
  const stuck=left.filter(p=>!hasAnyFit(p));
  if(stuck.length===left.length){
    updateBest();
    setTimeout(()=>show("Restructuring failed.",
      `${stuck.length===1?stuck[0].def.name+" has":"Some coworkers have"} nowhere to go. HR has been notified.`,
      `${score} pts`, "Try this floor again", ()=>load(L)),420);
  }
}
function show(title,body,sc,btn,fn,rating){
  document.getElementById("ovTitle").textContent=title;
  document.getElementById("ovBody").textContent=body;
  document.getElementById("ovScore").textContent=sc;
  const rt=document.getElementById("ovRating"); if(rt) rt.textContent=rating||"";
  const sh=document.getElementById("ovShare");
  if(sh) sh.style.display=rating?"":"none";
  const b=document.getElementById("ovBtn"); b.textContent=btn;
  b.onclick=()=>{ overlay.classList.remove("show"); fn(); };
  overlay.classList.add("show");
}

/* ---------------- Share loop: every floor is a link ------------------------------------------ */
function floorLink(i){
  try{
    const u=new URL(window.location.href);
    u.search=""; u.hash=""; u.searchParams.set("floor",i+1);
    return u.toString();
  }catch(e){ return "https://fireyourcoworkers.com/?floor="+(i+1); }
}
async function shareFloor(){
  const link=floorLink(L);
  const text=`I cleared Floor ${L+1} "${levelDef().name}" — ${hrRating()} — ${score} pts. Your move.`;
  try{
    if(navigator.share){ await navigator.share({title:"Fire Your Coworkers",text,url:link}); return; }
  }catch(e){}
  try{
    await navigator.clipboard.writeText(text+" "+link);
    say("LINK COPIED","Paste it where your coworkers will see it.");
  }catch(e){
    say("SHARE",link);
  }
}
{
  const sh=document.getElementById("ovShare");
  if(sh) sh.onclick=()=>{ ac(); shareFloor(); };
}
function nextLevel(){
  if(L+1<LEVELS.length){
    // Executive Floors are the level-pack money-maker: visible on the ladder from
    // floor 1, playable the moment the pack is owned.
    if(LEVELS[L+1].premium && !owns("exec")){ openShop("exec"); return; }
    load(L+1);
  } else { score=0; load(0); }
}

/* ---------------- Company Store -------------------------------------------------------------- */
const shopEl=document.getElementById("shop");
function shopRow({name,desc,cost,ownedNow,equipped,swatches,premium,onBuy,onEquip}){
  const row=document.createElement("div"); row.className="shopItem";
  const sw=document.createElement("div"); sw.className="shopSw";
  (swatches||[]).forEach(c=>{ const i=document.createElement("i"); i.style.background=c; sw.appendChild(i); });
  const info=document.createElement("div"); info.className="shopInfo";
  info.innerHTML=`<div class="shopName">${name}${premium?'<span class="premTag">PREMIUM</span>':''}</div>
                  <div class="shopDesc">${desc}</div>`;
  const btn=document.createElement("button"); btn.className="shopBtn";
  if(ownedNow){
    if(onEquip&&!equipped){ btn.textContent="Equip"; btn.onclick=onEquip; }
    else { btn.textContent=equipped?"Equipped":"Owned"; btn.classList.add("owned"); btn.disabled=!!equipped; }
  }else{
    btn.textContent=`${cost} 🪙`;
    btn.disabled=wallet.coins<cost;
    btn.onclick=onBuy;
  }
  row.appendChild(sw); row.appendChild(info); row.appendChild(btn);
  return row;
}
function renderShop(highlight){
  const list=document.getElementById("shopItems"); list.innerHTML="";
  list.appendChild(shopRow({
    name:EXEC_PACK.name, desc:EXEC_PACK.desc, cost:EXEC_PACK.cost, premium:true,
    ownedNow:owns("exec"),
    swatches:["#f2c94c","#d9a520","#8a6d1f"],
    onBuy:()=>buy("exec",EXEC_PACK.cost)
  }));
  for(const s of SKINS){
    if(s.id==="classic") continue;
    list.appendChild(shopRow({
      name:s.name, desc:s.desc, cost:s.cost, premium:s.cost>=1000,
      ownedNow:owns(s.id), equipped:wallet.skin===s.id,
      swatches:["sleeping_intern","micromanager_boss","gossip_worker","the_ceo"]
        .map(id=>(s.colors&&s.colors[id])||byId(id).color),
      onBuy:()=>buy(s.id,s.cost),
      onEquip:()=>{ wallet.skin=s.id; saveWallet(); renderShop(); repaintAll(); tone(660,.1,"sine",.07); }
    }));
  }
  if(wallet.skin!=="classic"){
    list.appendChild(shopRow({
      name:"Corporate Classic", desc:"Back to standard issue.", cost:0,
      ownedNow:true, equipped:false,
      swatches:["sleeping_intern","micromanager_boss","gossip_worker","the_ceo"].map(id=>byId(id).color),
      onEquip:()=>{ wallet.skin="classic"; saveWallet(); renderShop(); repaintAll(); tone(660,.1,"sine",.07); }
    }));
  }
  updateCoinsUI();
}
function buy(id,cost){
  if(wallet.coins<cost||owns(id)) return;
  wallet.coins-=cost; wallet.owned.push(id);
  if(SKINS.some(s=>s.id===id)) wallet.skin=id;
  saveWallet(); renderShop(); repaintAll();
  tone(1046,.08,"sine",.09); setTimeout(()=>tone(1318,.16,"sine",.09),90);
  spawnConfetti();
}
function repaintAll(){
  pieces.forEach(p=>{ buildPieceEl(p); if(p.placed) positionOnGrid(p); });
  relayoutTray(); refreshAllSquish();
}
function openShop(highlight){ renderShop(highlight); shopEl.classList.add("show"); }
function closeShop(){ shopEl.classList.remove("show"); }
document.getElementById("btnShop").onclick=()=>{ ac(); openShop(); };
document.getElementById("shopClose").onclick=()=>closeShop();

/* ---------------- Level lifecycle ------------------------------------------------------------ */
function load(i){
  // Input is refused while an overlay is up, so a level load must always take it
  // down — otherwise finishing a floor leaves the next one permanently unresponsive.
  overlay.classList.remove("show");
  bubbleEl.classList.remove("show");
  document.getElementById("shop").classList.remove("show");
  doors.classList.remove("closed");
  L=i;
  document.getElementById("lvl").textContent=(i+1);
  document.getElementById("lvlTotal").textContent="/"+LEVELS.length;
  document.getElementById("score").textContent=score;
  updateCoinsUI();
  floorUndos=0; floorInvalid=0;
  const d=levelDef();
  grid=Array.from({length:d.h},()=>Array(d.w).fill(null));
  pieces.forEach(p=>p.el&&p.el.remove());
  pieces=[]; history=[]; held=null; ghost=[]; tray.innerHTML="";
  d.cast.forEach((cid,n)=>{
    const def=byId(cid); if(!def) return;
    const base=normalize(def.shape_matrix.map(c=>c.slice()));
    const p={uid:n+1, def, baseShape:base, shape:base.map(c=>c.slice()), rot:0,
             placed:false, anchor:null, grab:[0,0], el:null, body:null, skin:null, face:null, unit:cellPx};
    pieces.push(p); buildPieceEl(p); positionInTray(p);
    p.el.classList.add("pop");
    p.el.style.animationDelay=(n*70)+"ms";
  });
  layout(); syncButtons();
  if(d.name) say("FLOOR "+(i+1), d.name);
}
function undo(){
  const last=history.pop(); if(!last) return;
  const p=pieces.find(q=>q.uid===last.uid); if(!p) return;
  floorUndos++;
  release(p); score=Math.max(0,score-p.def.base_score);
  document.getElementById("score").textContent=score;
  p.rot=last.rot; p.shape=rotateN(p.baseShape,p.rot);
  clearSquish(p); relayoutTray();
  refreshAllSquish(); syncButtons(); tone(280,.09,"sine",.05);
}
function syncButtons(){
  document.getElementById("btnUndo").disabled = history.length===0;
  document.getElementById("btnRotate").disabled = pieces.every(p=>p.placed);
}

document.getElementById("btnRotate").onclick=()=>{ ac(); rotateHeld(); };
document.getElementById("btnUndo").onclick=()=>{ ac(); undo(); };
document.getElementById("btnReset").onclick=()=>{ ac(); score=0; load(L); };
window.addEventListener("resize",()=>layout());
window.addEventListener("orientationchange",()=>setTimeout(layout,120));

/* Deep links: ?floor=N opens that floor directly — the viral clip lands the viewer on
   the exact challenge. A premium floor deep-link lands on floor 1 with the store open. */
(function(){
  let start=0;
  try{
    const n=parseInt(new URLSearchParams(window.location.search).get("floor"),10);
    if(n>=1&&n<=LEVELS.length){
      if(LEVELS[n-1].premium&&!owns("exec")){ load(0); openShop("exec"); return; }
      start=n-1;
    }
  }catch(e){}
  load(start);
})();

/* PWA: register the service worker only where it can actually work. */
if(typeof navigator!=="undefined" && "serviceWorker" in navigator
   && window.location && /^https?:$/.test(window.location.protocol)){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* Test seam. Read-only: the harness observes state and drives the game through real
   pointer events, exactly as a finger would. Nothing here mutates gameplay. */
window.__FYC__={
  CHARACTERS,LEVELS,normalize,rotateCW,rotateN,extent,sameShape,byId,
  debug(){
    const r=shaft.getBoundingClientRect();
    return {
      level:L, cellPx, score, over:overlay.classList.contains("show"),
      shopOpen:document.getElementById("shop").classList.contains("show"),
      wallet:{coins:wallet.coins, owned:wallet.owned.slice(), skin:wallet.skin},
      overTitle:document.getElementById("ovTitle").textContent,
      shaft:{left:r.left,top:r.top,width:r.width,height:r.height},
      dims:{w:levelDef().w,h:levelDef().h},
      grid:grid.map(row=>row.slice()),
      pieces:pieces.map(p=>{
        const b=p.el.getBoundingClientRect();
        return {uid:p.uid,id:p.def.id,rot:p.rot,placed:p.placed,
                anchor:p.anchor?p.anchor.slice():null,
                shape:p.shape.map(c=>c.slice()),unit:p.unit,
                rect:{left:b.left,top:b.top,width:b.width,height:b.height}};
      })
    };
  },
  goto(i){ score=0; load(i); }
};
