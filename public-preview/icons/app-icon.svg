<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Fire Your Coworkers app icon</title>
  <desc id="desc">A startled executive squeezed inside a glowing office elevator</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.55" stop-color="#102d45"/>
      <stop offset="1" stop-color="#07101a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8efff" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#376b86" stop-opacity=".42"/>
      <stop offset="1" stop-color="#14293b" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe47a"/>
      <stop offset=".48" stop-color="#ffbb2e"/>
      <stop offset="1" stop-color="#bb6412"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff604d"/>
      <stop offset="1" stop-color="#bd1d25"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M0 365C114 314 185 333 263 376c81 44 155 38 249-13v149H0Z" fill="#02070d" opacity=".52"/>
  <circle cx="100" cy="94" r="76" fill="#1d78a2" opacity=".18"/>
  <circle cx="419" cy="403" r="110" fill="#e43a32" opacity=".12"/>

  <g filter="url(#shadow)">
    <rect x="102" y="74" width="308" height="364" rx="47" fill="#0a1119" stroke="url(#gold)" stroke-width="13"/>
    <rect x="124" y="99" width="264" height="313" rx="30" fill="url(#glass)" stroke="#d8f7ff" stroke-opacity=".6" stroke-width="5"/>
    <path d="M256 101v309" stroke="#d8f7ff" stroke-opacity=".34" stroke-width="4"/>
    <path d="M142 119h86L137 272Z" fill="#fff" opacity=".11"/>
    <rect x="178" y="52" width="156" height="53" rx="18" fill="#090d12" stroke="#ffc84c" stroke-width="6"/>
    <text x="256" y="88" fill="#ffd65c" font-family="Arial Black, Arial, sans-serif" font-size="25" text-anchor="middle" letter-spacing="3">FLOOR 01</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M148 365c10-72 37-102 69-117h79c39 19 61 55 69 117Z" fill="#162f50" stroke="#06101b" stroke-width="8"/>
    <path d="m220 251 36 38 37-38-11 103h-51Z" fill="#f4f1e8"/>
    <path d="m256 289-15 27 15 47 15-47Z" fill="url(#red)"/>
    <path d="M186 283 133 335m193-52 53 52" fill="none" stroke="#172e4d" stroke-width="35" stroke-linecap="round"/>
    <path d="M188 286 129 330m195-44 59 44" fill="none" stroke="#d9e4ec" stroke-width="7" stroke-linecap="round" opacity=".25"/>
    <ellipse cx="256" cy="202" rx="71" ry="68" fill="#e7a26d" stroke="#261811" stroke-width="8"/>
    <path d="M186 198c3-66 31-93 72-93 44 0 70 34 70 92-18-18-37-31-64-32-31-1-53 13-78 33Z" fill="#24201d"/>
    <path d="M208 188q22-17 43 1m11 0q22-17 43 1" fill="none" stroke="#17100d" stroke-width="11" stroke-linecap="round"/>
    <rect x="199" y="184" width="50" height="35" rx="14" fill="#eaf8ff" fill-opacity=".88" stroke="#171b1e" stroke-width="7"/>
    <rect x="263" y="184" width="50" height="35" rx="14" fill="#eaf8ff" fill-opacity=".88" stroke="#171b1e" stroke-width="7"/>
    <path d="M249 198h14" stroke="#171b1e" stroke-width="7"/>
    <circle cx="226" cy="201" r="6" fill="#111"/><circle cx="286" cy="201" r="6" fill="#111"/>
    <path d="M227 244q29-23 58 0" fill="none" stroke="#3b1716" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="rotate(-8 256 403)" filter="url(#shadow)">
    <rect x="85" y="363" width="342" height="83" rx="18" fill="url(#red)" stroke="#ff8879" stroke-width="6"/>
    <rect x="99" y="377" width="314" height="55" rx="11" fill="none" stroke="#27080a" stroke-width="5" stroke-dasharray="9 6"/>
    <text x="256" y="417" fill="#fff3d4" font-family="Arial Black, Arial, sans-serif" font-size="39" text-anchor="middle" letter-spacing="4">FIRED!</text>
  </g>

  <path d="M400 122l12 24 27 4-20 19 5 27-24-13-24 13 5-27-20-19 27-4Z" fill="#ffe477" filter="url(#glow)"/>
</svg>
